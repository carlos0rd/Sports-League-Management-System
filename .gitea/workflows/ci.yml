# CI/CD para Codeberg (Forgejo Actions)
#
# Requisitos en Codeberg:
#   1. Repositorio público
#   2. Settings → Units → activar "Actions"
#   3. Push a una rama monitorizada
#
# Runners disponibles: codeberg-tiny | codeberg-small | codeberg-medium
# Documentación: https://docs.codeberg.org/ci/actions/

name: CI

on:
  push:
    branches:
      - main
      - develop
      - new
      - release
      - hotfix
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
      - new
      - release
      - hotfix

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'
  SECRET_KEY: ci-test-secret
  DATABASE_URL: postgresql://user:pass@localhost:5432/test
  FOOTBALL_DATA_API_KEY: test-key

jobs:
  validate:
    name: Lint, compile and import check
    runs-on: codeberg-small

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff (report only)
        run: |
          # El proyecto tiene avisos de estilo pendientes; no bloqueamos el pipeline por E501, etc.
          ruff check . --exit-zero

      - name: Syntax check (core modules)
        run: |
          python -m py_compile \
            main.py \
            db.py \
            config.py \
            admin_routes.py \
            user_routes.py \
            gis_routes.py \
            sync_api.py \
            notification_service.py

      - name: Syntax check (scripts)
        run: python -m compileall -q scripts

      - name: Import smoke test
        run: |
          python - <<'PY'
          import main
          import notification_service

          required = (
              "notify_new_match",
              "detect_upcoming_matches",
              "run_notification_detection",
              "create_notification",
          )
          missing = [name for name in required if not hasattr(notification_service, name)]
          if missing:
              raise SystemExit(f"Missing notification_service exports: {missing}")

          print("Import smoke test OK")
          PY
