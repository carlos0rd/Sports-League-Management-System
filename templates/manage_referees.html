{% extends "layout.html" %}
{% block title %}Manage Referees - Admin Panel{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Manage Referees</h1>
    <div class="row">
        <div class="col-md-6">
            <h2 id="form-title">Add Referee</h2>
            <form action="{{ url_for('admin.manage_referees') }}" method="POST">
                <input type="hidden" id="referee_id" name="referee_id">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="nationality">Nationality:</label>
                    <input type="text" class="form-control" id="nationality" name="nationality" required>
                </div>
                <button type="submit" name="submit" class="btn btn-primary" id="submit-button">Add Referee</button>
            </form>
        </div>
        <div class="col-md-6">
            <h2>Existing Referees</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Nationality</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for referee in referees %}
                    <tr>
                        <td>{{ referee[0] }}</td>
                        <td>{{ referee[1] }}</td>
                        <td>{{ referee[2] }}</td>
                        <td>
                            <button
    type="button"
    class="btn btn-success btn-sm edit-referee-btn"
    data-id="{{ referee[0] }}"
    data-name="{{ referee[1] }}"
    data-nationality="{{ referee[2] or '' }}">
    <i class="fa fa-pencil-alt"></i>
</button>
                        </td>
                        <td>
                            <form
    action="{{ url_for('admin.manage_referees') }}"
    method="POST"
    style="display:inline;"
    onsubmit="return confirm('Are you sure you want to delete this referee?');">

    <input type="hidden" name="deleteItemId" value="{{ referee[0] }}">

    <button type="submit" name="delete" class="btn btn-danger btn-sm">
        <i class="fa fa-minus"></i>
    </button>
</form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.edit-referee-btn').forEach(function(button) {
        button.addEventListener('click', function() {
            document.getElementById('referee_id').value = this.getAttribute('data-id');
            document.getElementById('name').value = this.getAttribute('data-name') || '';
            document.getElementById('nationality').value = this.getAttribute('data-nationality') || '';

            document.getElementById('submit-button').innerText = 'Update Referee';
            document.getElementById('form-title').innerText = 'Edit Referee';
        });
    });
</script>
{% endblock %}
